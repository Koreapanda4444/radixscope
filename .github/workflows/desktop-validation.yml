name: Desktop validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/check_numeric.py'
      - 'build_windows.bat'
      - 'pyproject.toml'
      - '.github/workflows/desktop-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build using the existing Windows command
        shell: cmd
        run: build_windows.bat
      - name: Verify exact arithmetic, Qt workspaces and the packaged executable
        run: python scripts/check_numeric.py --desktop --exe dist/RadixScope/RadixScope.exe
      - name: Retain rendered icon resources for inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-icon-validation
          path: |
            build/windows/radixscope*.png
            build/windows/radixscope.ico
            build/windows/version.txt
          if-no-files-found: ignore
          retention-days: 7
