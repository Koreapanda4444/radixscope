name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts packaging
      - run: python -m mypy src scripts packaging
      - run: python -m radixscope --version
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    name: Windows standalone desktop
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: RadixScope-windows-x64
          path: dist/RadixScope-*-windows-x64.zip
          if-no-files-found: error
