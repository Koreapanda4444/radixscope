name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts packaging
      - run: python -m mypy src tests scripts packaging
      - run: python -m pytest --cov=radixscope --cov-report=term-missing
      - run: python -m build
      - run: python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    name: Windows standalone desktop
    needs: quality
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python scripts/build_desktop.py
      - run: python scripts/verify_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: RadixScope-windows-x64
          path: dist/RadixScope-*-windows-x64.zip
          if-no-files-found: error
