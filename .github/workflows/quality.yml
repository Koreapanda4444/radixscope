name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install --upgrade pip
      - id: install
        run: python -m pip install -e ".[dev]"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src scripts packaging
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy src scripts packaging
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python scripts/verify_numeric.py
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '--exhaustive' || '' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m radixscope.gui.verification
      - run: python -m radixscope --version
      - run: python -m build
      - run: python scripts/verify_repository.py --packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    name: Windows standalone desktop
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python scripts/build_desktop.py --installer
      - name: Check executable product metadata
        shell: pwsh
        run: |
          $metadata = (Get-Item "dist/desktop/RadixScope/RadixScope.exe").VersionInfo
          if ($metadata.ProductVersion -ne "1.0.0" -or $metadata.FileVersion -ne "1.0.0") {
            throw "Unexpected Windows product metadata"
          }
      - run: python scripts/verify_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: RadixScope-windows-x64
          path: |
            dist/RadixScope-*-windows-x64.zip
            dist/RadixScope-*-windows-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-distribution-verification
          path: build/desktop/verification/*
          if-no-files-found: ignore
