[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radixscope"
version = "1.0.0"
description = "Exact radix conversion and number-representation toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Koreapanda4444" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Koreapanda4444/radixscope"
Documentation = "https://github.com/Koreapanda4444/radixscope/tree/main/docs"
Issues = "https://github.com/Koreapanda4444/radixscope/issues"

[project.scripts]
radixscope = "radixscope.cli:main"
radixscope-gui = "radixscope.gui:main"

[project.optional-dependencies]
# PySide6 6.12.0 over-releases Python singletons (PYSIDE-3474).
desktop-build = ["PySide6==6.11.3", "pyinstaller>=6.22.3,<7"]
gui = ["PySide6>=6.8,<7,!=6.12.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radixscope = ["py.typed", "assets/*.svg", "assets/*.json"]
