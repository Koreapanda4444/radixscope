[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radixscope"
version = "2.1.0"
description = "Exact radix conversion and number-representation toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Koreapanda4444" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Koreapanda4444/radixscope"
Documentation = "https://github.com/Koreapanda4444/radixscope/tree/main/docs"
Issues = "https://github.com/Koreapanda4444/radixscope/issues"

[project.scripts]
radixscope = "radixscope.cli:main"
radixscope-gui = "radixscope.gui:main"

[project.optional-dependencies]
desktop-build = ["PySide6>=6.8,<7", "pyinstaller>=6.22.3,<7"]
gui = ["PySide6>=6.8,<7"]
dev = [
    "build>=1,<2",
    "PySide6>=6.8,<7",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radixscope = ["py.typed", "assets/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["radixscope"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["radixscope"]

[tool.coverage.report]
show_missing = true
skip_covered = true
